
name: Memory Subsystem Tests

on:
  push:
  pull_request:

jobs:
  address-generation:
    name: AGU Cocotb Tests
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Verilator
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator make g++
          verilator --version

      # 4. Install Cocotb 1.9.2
      - name: Install Cocotb
        run: |
          python -m pip install "cocotb==1.9.2"
          cocotb-config --version

      # 5. Debug Python environment
      - name: Debug Python environment
        run: |
          python --version
          which python
          which verilator
          python -c "import encodings; print(encodings.__file__)"
          env | grep -E '^(PYTHONHOME|PYTHONPATH)=' || true

      # 6. Run AGU tests
      - name: Run AGU Cocotb tests
        working-directory: OoOFinalProject-Files/memory/tests/addr_gen
        run: |
          unset PYTHONHOME
          unset PYTHONPATH
          make SIM=verilator
