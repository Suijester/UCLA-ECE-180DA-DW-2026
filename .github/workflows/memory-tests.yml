
name: Memory Subsystem Tests

on:
  push:
  pull_request:

jobs:
  address-generation:
    name: AGU Cocotb Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Verilator and Make
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator make g++

      - name: Install Cocotb
        run: |
          python -m pip install "cocotb>=2.0,<3"

      - name: Run AGU tests
        working-directory: OoOFinalProject-Files/memory/tests/addr_gen
        run: make SIM=verilator
