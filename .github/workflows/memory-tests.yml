
name: Memory Subsystem Tests

on:
  push:
  pull_request:

jobs:
  address-generation:
    name: AGU Cocotb Tests
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Verilator from Ubuntu packages
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator make g++
          verilator --version

      # 4. Install Cocotb 1.9.2
      - name: Install Cocotb
        run: |
          python -m pip install "cocotb==1.9.2"
          cocotb-config --version

      # 5. Run AGU tests
      - name: Run AGU Cocotb tests
        working-directory: OoOFinalProject-Files/memory/tests/addr_gen
        run: |
          make SIM=verilator
